name: Core CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and pack (Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run repository checks
        run: npm run check

      - name: Pack and test the consumer archive
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/qscriptions-core"
          mkdir -p "$artifact_dir"
          npm pack --workspace packages/core --pack-destination "$artifact_dir"

          shopt -s nullglob
          archives=("$artifact_dir"/*.tgz)
          if [[ "${#archives[@]}" -ne 1 ]]; then
            echo "Expected exactly one package archive, found ${#archives[@]}" >&2
            exit 1
          fi
          tarball="${archives[0]}"

          if tar -tf "$tarball" | grep -Eq '(^|/)(fixtures?|tests?)(/|$)|\.webp$'; then
            echo "Repository-only tests, fixtures, or WebP assets leaked into the npm archive" >&2
            exit 1
          fi

          npm run test:tarball -- "$tarball"
          (
            cd "$artifact_dir"
            sha256sum "$(basename "$tarball")" > SHA256SUMS
          )
          printf 'artifact_dir=%s\n' "$artifact_dir" >> "$GITHUB_OUTPUT"

      - name: Upload tested archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qscriptions-core-${{ github.sha }}
          path: ${{ steps.pack.outputs.artifact_dir }}
          if-no-files-found: error
          retention-days: 7
