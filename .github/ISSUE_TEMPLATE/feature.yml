name: Feature proposal
description: Propose an improvement within the frozen-QPET compatibility scope.
title: "proposal: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete user or implementer problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Explain the API, compatibility, and trust-boundary impact.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This does not reinterpret or narrow already-valid QPET v1 bytes.
          required: true
        - label: This does not add wallet, network, DOM, or rendering behavior to the core.
          required: true
